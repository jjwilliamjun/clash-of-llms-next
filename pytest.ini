[pytest]
# `pytest` from the repository root now collects and runs. It did not before: two test
# modules share the basename test_create_network.py, and under pytest's default "prepend"
# import mode the second one collides with the first and collection aborts before a single
# test runs. importlib mode imports each file under its own path instead.
addopts =
    --import-mode=importlib
    --ignore=clash-of-llms/flask_app/excel_api/create_node_network

testpaths = clash-of-llms/flask_app

# The modules import each other as top-level names -- `from team import Team`,
# `from create_network import create_node_network` -- so the directories holding them have
# to be importable, not just flask_app itself.
pythonpath =
    clash-of-llms/flask_app
    clash-of-llms/flask_app/class_api
    clash-of-llms/flask_app/create_node_network

# On the ignore above: flask_app/excel_api/create_node_network/ is an older, 53-line-divergent
# copy of flask_app/create_node_network/ (it predates the rejectMessaging attribute). Nothing
# in the application imports it. It is excluded rather than deleted so that removing it stays
# a deliberate decision rather than a side effect of getting the tests running.
